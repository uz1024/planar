<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Симулятор Раскраски Графов</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #111827; /* Темно-серый фон (Tailwind bg-gray-900) */
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .font-display { font-family: 'Orbitron', sans-serif; }
        
        .color-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 3px solid transparent;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .color-btn:hover { transform: scale(1.1); }
        .color-btn.selected {
            border-color: #e2e8f0;
            transform: scale(1.2);
            box-shadow: 0 0 15px currentColor;
        }

        #btn-reset {
            transition: all 0.2s ease;
        }
        #btn-reset:hover {
            background-color: #374151; /* hover:bg-gray-700 */
            transform: scale(1.05);
        }
        #btn-reset:active {
            transform: scale(0.95);
        }

        #toast-warning {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
            transform: translate(-50%, -20px);
        }
        #toast-warning.show {
            opacity: 1;
            transform: translate(-50%, 0);
            pointer-events: auto;
        }
    </style>
</head>
<body class="w-screen h-screen relative text-gray-200">

    <header class="bg-gray-800 text-white p-4 shadow-lg flex justify-between items-center z-20 relative w-full border-b border-gray-700">
        <div class="flex items-center gap-4">
            <h1 class="text-xl sm:text-2xl font-bold font-display text-cyan-400 hidden sm:block tracking-widest drop-shadow-md">ХРОМА</h1>
            <div class="flex flex-col">
                <span class="text-[10px] sm:text-xs text-gray-400 uppercase tracking-wide">Уровень</span>
                <span id="ui-level" class="text-yellow-400 text-lg sm:text-xl font-bold font-display">1</span>
            </div>
        </div>

        <div class="flex gap-4 sm:gap-8 text-right">
            <div class="flex flex-col items-center">
                <span class="text-[10px] sm:text-xs text-gray-400 uppercase tracking-wide">Очки</span>
                <span id="ui-score" class="text-green-400 text-base sm:text-lg font-bold font-display">0</span>
            </div>
            <div class="flex flex-col items-center">
                <span class="text-[10px] sm:text-xs text-gray-400 uppercase tracking-wide">Время</span>
                <span id="ui-time" class="text-white text-base sm:text-lg font-mono font-semibold">00:00</span>
            </div>
            <div class="flex flex-col items-center">
                <span class="text-[10px] sm:text-xs text-gray-400 uppercase tracking-wide">Шаги</span>
                <span id="ui-clicks" class="text-white text-base sm:text-lg font-mono font-semibold">0</span>
            </div>
        </div>
    </header>

    <main class="w-full h-full absolute top-0 left-0 z-0 bg-gray-900">
        <canvas id="game-canvas" class="block w-full h-full"></canvas>
    </main>

    <div id="toast-warning" class="absolute top-24 left-1/2 bg-red-600/95 border border-red-400 text-white px-6 py-3 rounded-2xl shadow-[0_0_20px_rgba(220,38,38,0.5)] z-40 opacity-0 pointer-events-none text-center flex flex-col items-center justify-center">
        <span class="font-medium text-sm sm:text-base">Можно закрасить меньшим количеством цветов!</span>
        <span id="toast-message" class="font-bold text-lg mt-1 text-red-200">Минимум: 4</span>
    </div>

    <div id="win-overlay" class="hidden absolute inset-0 z-50 bg-gray-950/80 backdrop-blur-md flex items-center justify-center">
        <div class="bg-gray-800 rounded-3xl p-8 text-center max-w-md w-[90%] shadow-2xl pointer-events-auto border border-gray-700">
            <h2 class="text-4xl font-bold font-display text-green-400 mb-2 drop-shadow-md">УРОВЕНЬ ПРОЙДЕН</h2>
            <p class="text-gray-400 mb-6 font-medium">Граф раскрашен оптимально!</p>
            
            <div class="grid grid-cols-2 gap-y-3 gap-x-4 mb-6 text-left text-gray-300 bg-gray-900 p-4 rounded-xl border border-gray-700">
                <span>Использовано цветов:</span>
                <span id="stat-colors-used" class="text-right font-bold font-mono text-white">0</span>

                <span>Бонус за время:</span>
                <span id="stat-time-bonus" class="text-right font-bold font-mono text-green-400">+0</span>
                
                <span>Бонус за шаги:</span>
                <span id="stat-click-bonus" class="text-right font-bold font-mono text-green-400">+0</span>
                
                <div class="col-span-2 border-t border-gray-700 my-1"></div>
                
                <span class="text-lg font-bold text-gray-200">Всего очков:</span>
                <span id="stat-level-score" class="text-lg text-right font-bold text-yellow-400 font-display">0</span>
            </div>

            <button id="btn-next-level" class="w-full py-4 bg-gradient-to-r from-green-600 to-emerald-500 text-white font-bold text-lg rounded-xl hover:from-green-500 hover:to-emerald-400 transition-all uppercase tracking-widest shadow-[0_0_15px_rgba(16,185,129,0.4)]">
                Следующий граф
            </button>
        </div>
    </div>

    <div class="absolute bottom-6 w-full flex justify-center z-20 pointer-events-none">
        <div class="pointer-events-auto flex items-center gap-2 sm:gap-3 bg-gray-800/90 backdrop-blur-md p-3 sm:p-4 rounded-full shadow-2xl border border-gray-700" id="color-palette">
            <!-- 8 Ярких цветов -->
            <button class="color-btn w-10 h-10 sm:w-12 sm:h-12 rounded-full cursor-pointer flex-shrink-0" data-color="#ef4444" style="background-color: #ef4444; color: #ef4444;"></button>
            <button class="color-btn w-10 h-10 sm:w-12 sm:h-12 rounded-full cursor-pointer flex-shrink-0" data-color="#f97316" style="background-color: #f97316; color: #f97316;"></button>
            <button class="color-btn w-10 h-10 sm:w-12 sm:h-12 rounded-full cursor-pointer flex-shrink-0" data-color="#eab308" style="background-color: #eab308; color: #eab308;"></button>
            <button class="color-btn w-10 h-10 sm:w-12 sm:h-12 rounded-full cursor-pointer flex-shrink-0" data-color="#22c55e" style="background-color: #22c55e; color: #22c55e;"></button>
            <button class="color-btn w-10 h-10 sm:w-12 sm:h-12 rounded-full cursor-pointer flex-shrink-0" data-color="#06b6d4" style="background-color: #06b6d4; color: #06b6d4;"></button>
            <button class="color-btn w-10 h-10 sm:w-12 sm:h-12 rounded-full cursor-pointer flex-shrink-0" data-color="#3b82f6" style="background-color: #3b82f6; color: #3b82f6;"></button>
            <button class="color-btn w-10 h-10 sm:w-12 sm:h-12 rounded-full cursor-pointer flex-shrink-0" data-color="#a855f7" style="background-color: #a855f7; color: #a855f7;"></button>
            <button class="color-btn w-10 h-10 sm:w-12 sm:h-12 rounded-full cursor-pointer flex-shrink-0" data-color="#ec4899" style="background-color: #ec4899; color: #ec4899;"></button>
            
            <div class="w-px h-10 bg-gray-600 mx-1"></div> <!-- Разделитель -->
            
            <!-- Кнопка сброса (Пустой круг с диагональным крестом) -->
            <button id="btn-reset" class="w-10 h-10 sm:w-12 sm:h-12 rounded-full border-2 border-gray-500 bg-gray-800 flex items-center justify-center flex-shrink-0 group" title="Очистить все цвета">
                <svg class="w-6 h-6 sm:w-7 sm:h-7 text-gray-400 group-hover:text-red-400 transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const STATE = {
            level: 1,
            score: 0,
            nodes: [],
            edges: [],
            chromaticNumber: 4,
            selectedColor: '#ef4444',
            timeStart: 0,
            clicks: 0,
            isPlaying: false,
            draggedNode: null
        };

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let toastTimeout;

        const uiElements = {
            level: document.getElementById('ui-level'),
            score: document.getElementById('ui-score'),
            time: document.getElementById('ui-time'),
            clicks: document.getElementById('ui-clicks'),
            winOverlay: document.getElementById('win-overlay'),
            btnNextLevel: document.getElementById('btn-next-level'),
            btnReset: document.getElementById('btn-reset'),
            colorButtons: document.querySelectorAll('.color-btn'),
            toastWarning: document.getElementById('toast-warning'),
            toastMessage: document.getElementById('toast-message')
        };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function dist(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        function ccw(A, B, C) {
            return (C.y - A.y) * (B.x - A.x) > (B.y - A.y) * (C.x - A.x);
        }

        function linesIntersect(p1, p2, p3, p4) {
            return ccw(p1, p3, p4) !== ccw(p2, p3, p4) && ccw(p1, p2, p3) !== ccw(p1, p2, p4);
        }

        class UnionFind {
            constructor(size) { this.parent = Array.from({length: size}, (_, i) => i); }
            find(i) {
                if (this.parent[i] === i) return i;
                return this.parent[i] = this.find(this.parent[i]);
            }
            union(i, j) {
                const rootI = this.find(i);
                const rootJ = this.find(j);
                if (rootI !== rootJ) {
                    this.parent[rootI] = rootJ;
                    return true;
                }
                return false;
            }
        }

        function calculateChromaticNumber(nodesCount, edges) {
            const adj = Array.from({length: nodesCount}, () => []);
            for(let e of edges) {
                adj[e.u].push(e.v);
                adj[e.v].push(e.u);
            }
            
            const colorsArr = new Array(nodesCount).fill(0);

            function isSafe(v, c) {
                for(let u of adj[v]) {
                    if(colorsArr[u] === c) return false;
                }
                return true;
            }

            function solveColoring(m, v) {
                if(v === nodesCount) return true;
                for(let c = 1; c <= m; c++) {
                    if(isSafe(v, c)) {
                        colorsArr[v] = c;
                        if(solveColoring(m, v + 1)) return true;
                        colorsArr[v] = 0;
                    }
                }
                return false;
            }

            // Пытаемся найти минимальное (хроматическое) число от 1 до 4
            for(let m = 1; m <= 4; m++) {
                colorsArr.fill(0);
                if(solveColoring(m, 0)) return m;
            }
            return 4; // По теореме о 4 красках
        }

        function generateAndTangleGraph(level) {
            STATE.nodes = [];
            STATE.edges = [];
            
            const numNodes = Math.min(6 + Math.floor((level - 1) * 1.5), 25);
            
            // 1. Создаем виртуальные узлы для математической генерации (чтобы граф был точно планарным)
            let virtualNodes = [];
            for(let i=0; i<numNodes; i++) {
                virtualNodes.push({ x: Math.random() * 1000, y: Math.random() * 1000 });
            }

            // 2. Строим минимальное остовное дерево, чтобы гарантировать связность
            let possibleEdges = [];
            for (let i = 0; i < numNodes; i++) {
                for (let j = i + 1; j < numNodes; j++) {
                    possibleEdges.push({u: i, v: j, d: dist(virtualNodes[i], virtualNodes[j])});
                }
            }
            possibleEdges.sort((a, b) => a.d - b.d);

            const uf = new UnionFind(numNodes);
            for (let edge of possibleEdges) {
                if (uf.union(edge.u, edge.v)) {
                    STATE.edges.push({u: edge.u, v: edge.v});
                }
            }

            // 3. Жадным образом добавляем непересекающиеся ребра (Триангуляция для усложнения)
            for (let edge of possibleEdges) {
                if (STATE.edges.some(e => (e.u === edge.u && e.v === edge.v) || (e.u === edge.v && e.v === edge.u))) continue;
                
                let intersects = false;
                const p1 = virtualNodes[edge.u];
                const p2 = virtualNodes[edge.v];

                for (let existing of STATE.edges) {
                    if (existing.u === edge.u || existing.u === edge.v || existing.v === edge.u || existing.v === edge.v) continue;
                    const p3 = virtualNodes[existing.u];
                    const p4 = virtualNodes[existing.v];
                    if (linesIntersect(p1, p2, p3, p4)) {
                        intersects = true;
                        break;
                    }
                }
                if (!intersects) STATE.edges.push({u: edge.u, v: edge.v});
            }

            // 4. Вычисляем Хроматическое число графа (математический лимит победы)
            STATE.chromaticNumber = calculateChromaticNumber(numNodes, STATE.edges);

            // 5. Разбрасываем фактические узлы в хаотичном порядке, чтобы "запутать" игрока
            const marginX = Math.min(canvas.width * 0.1, 50);
            const marginY = Math.min(canvas.height * 0.1, 100);
            
            for(let i = 0; i < numNodes; i++) {
                STATE.nodes.push({
                    id: i,
                    x: marginX + Math.random() * (canvas.width - marginX * 2),
                    y: marginY + Math.random() * (canvas.height - marginY * 2),
                    vx: 0, vy: 0,
                    color: null
                });
            }
        }

        function updatePhysics() {
            const REPULSION = 2500;
            const SPRING_LENGTH = Math.max(70, Math.min(150, canvas.width / Math.sqrt(STATE.nodes.length)));
            const SPRING_K = 0.04;
            const DAMPING = 0.75;
            const CENTER_K = 0.003;

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            let forces = Array.from({length: STATE.nodes.length}, () => ({x: 0, y: 0}));

            for(let i = 0; i < STATE.nodes.length; i++) {
                for(let j = i + 1; j < STATE.nodes.length; j++) {
                    let dx = STATE.nodes[i].x - STATE.nodes[j].x;
                    let dy = STATE.nodes[i].y - STATE.nodes[j].y;
                    let distance = Math.sqrt(dx*dx + dy*dy);
                    
                    if (distance < 1) distance = 1;
                    
                    let force = REPULSION / (distance * distance);
                    let fx = (dx / distance) * force;
                    let fy = (dy / distance) * force;

                    forces[i].x += fx; forces[i].y += fy;
                    forces[j].x -= fx; forces[j].y -= fy;
                }
            }

            for(let edge of STATE.edges) {
                let n1 = STATE.nodes[edge.u];
                let n2 = STATE.nodes[edge.v];
                
                let dx = n2.x - n1.x;
                let dy = n2.y - n1.y;
                let distance = Math.sqrt(dx*dx + dy*dy);
                if (distance < 1) distance = 1;

                let force = SPRING_K * (distance - SPRING_LENGTH);
                let fx = (dx / distance) * force;
                let fy = (dy / distance) * force;

                forces[edge.u].x += fx; forces[edge.u].y += fy;
                forces[edge.v].x -= fx; forces[edge.v].y -= fy;
            }

            for(let i = 0; i < STATE.nodes.length; i++) {
                let node = STATE.nodes[i];
                
                if(STATE.draggedNode === node.id) {
                    node.vx = 0; node.vy = 0;
                    continue;
                }

                forces[i].x += (centerX - node.x) * CENTER_K;
                forces[i].y += (centerY - node.y) * CENTER_K;

                node.vx = (node.vx + forces[i].x) * DAMPING;
                node.vy = (node.vy + forces[i].y) * DAMPING;

                node.x += node.vx;
                node.y += node.vy;

                // Защита от вылета за экран (с учетом панелей)
                if (node.x < 30) { node.x = 30; node.vx *= -0.5; }
                if (node.x > canvas.width - 30) { node.x = canvas.width - 30; node.vx *= -0.5; }
                if (node.y < 100) { node.y = 100; node.vy *= -0.5; } // Отступ верхней панели
                if (node.y > canvas.height - 120) { node.y = canvas.height - 120; node.vy *= -0.5; } // Отступ нижней палитры
            }
        }

        uiElements.colorButtons.forEach(btn => {
            if (btn.dataset.color === STATE.selectedColor) btn.classList.add('selected');
            btn.addEventListener('click', () => {
                STATE.selectedColor = btn.dataset.color;
                uiElements.colorButtons.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
            });
        });

        uiElements.btnReset.addEventListener('click', () => {
            if(!STATE.isPlaying) return;
            STATE.nodes.forEach(node => node.color = null);
            STATE.clicks++;
            uiElements.clicks.innerText = STATE.clicks;
        });

        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
            const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        const NODE_RADIUS = 20;

        function handlePointerDown(evt) {
            if (!STATE.isPlaying) return;
            const pos = getMousePos(evt);
            
            for (let i = STATE.nodes.length - 1; i >= 0; i--) {
                const node = STATE.nodes[i];
                if (dist(pos, node) <= NODE_RADIUS + 10) {
                    STATE.draggedNode = node.id;
                    
                    if (node.color !== STATE.selectedColor) {
                        node.color = STATE.selectedColor;
                        STATE.clicks++;
                        uiElements.clicks.innerText = STATE.clicks;
                        checkWinCondition();
                    }
                    break;
                }
            }
        }

        function handlePointerMove(evt) {
            if (STATE.draggedNode !== null) {
                const pos = getMousePos(evt);
                const node = STATE.nodes[STATE.draggedNode];
                node.x = pos.x;
                node.y = pos.y;
            }
        }

        function handlePointerUp() { STATE.draggedNode = null; }

        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handlePointerDown(e); }, {passive: false});
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handlePointerMove(e); }, {passive: false});
        window.addEventListener('touchend', handlePointerUp);

        function showWarningToast(limit) {
            clearTimeout(toastTimeout);
            uiElements.toastMessage.innerText = `Минимум: ${limit}`;
            uiElements.toastWarning.classList.add('show');
            
            toastTimeout = setTimeout(() => {
                uiElements.toastWarning.classList.remove('show');
            }, 4000);
        }

        function checkWinCondition() {
            let hasUncolored = false;
            let hasConflict = false;
            let usedColors = new Set();

            for (let node of STATE.nodes) {
                if (node.color === null) {
                    hasUncolored = true;
                } else {
                    usedColors.add(node.color);
                }
            }

            if (hasUncolored) return;

            // Проверка конфликтов смежных узлов
            for (let edge of STATE.edges) {
                const colorA = STATE.nodes[edge.u].color;
                const colorB = STATE.nodes[edge.v].color;
                if (colorA !== null && colorA === colorB) {
                    hasConflict = true;
                    break;
                }
            }

            if (!hasConflict) {
                const colorsCount = usedColors.size;
                if (colorsCount > STATE.chromaticNumber) {
                    // Игрок использовал больше цветов, чем нужно математически
                    showWarningToast(STATE.chromaticNumber);
                } else {
                    // Идеальная раскраска!
                    levelComplete(colorsCount);
                }
            }
        }

        function levelComplete(colorsUsed) {
            STATE.isPlaying = false;
            uiElements.toastWarning.classList.remove('show');
            
            const timeTaken = Math.floor((Date.now() - STATE.timeStart) / 1000);
            const parTime = STATE.nodes.length * 6; // Немного увеличим время на пар
            const timeBonus = Math.max(0, (parTime - timeTaken) * 20);
            
            const perfectClicks = STATE.nodes.length;
            const extraClicks = Math.max(0, STATE.clicks - perfectClicks);
            const efficiencyBonus = Math.max(0, 500 - (extraClicks * 25));

            const levelScore = 1000 + timeBonus + efficiencyBonus;
            STATE.score += levelScore;

            document.getElementById('stat-colors-used').innerText = `${colorsUsed} из ${STATE.chromaticNumber}`;
            document.getElementById('stat-time-bonus').innerText = `+${timeBonus}`;
            document.getElementById('stat-click-bonus').innerText = `+${efficiencyBonus}`;
            document.getElementById('stat-level-score').innerText = levelScore;
            uiElements.score.innerText = STATE.score;

            uiElements.winOverlay.classList.remove('hidden');
        }

        uiElements.btnNextLevel.addEventListener('click', () => {
            uiElements.winOverlay.classList.add('hidden');
            STATE.level++;
            startLevel();
        });

        function startLevel() {
            uiElements.level.innerText = STATE.level;
            STATE.clicks = 0;
            uiElements.clicks.innerText = "0";
            STATE.draggedNode = null;
            
            generateAndTangleGraph(STATE.level);
            
            STATE.timeStart = Date.now();
            STATE.isPlaying = true;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Отрисовка связей (ребер)
            STATE.edges.forEach(edge => {
                const nodeA = STATE.nodes[edge.u];
                const nodeB = STATE.nodes[edge.v];
                
                const colorA = nodeA.color;
                const colorB = nodeB.color;
                const isConflict = colorA !== null && colorA === colorB;

                ctx.beginPath();
                ctx.moveTo(nodeA.x, nodeA.y);
                ctx.lineTo(nodeB.x, nodeB.y);
                
                if (isConflict) {
                    ctx.strokeStyle = '#ef4444'; // Ярко-красный конфликт
                    ctx.lineWidth = 5;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#ef4444';
                } else {
                    ctx.strokeStyle = '#6b7280'; // Светло-серый на темном фоне
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = 0;
                }
                ctx.stroke();
            });

            // Отрисовка узлов (вершин)
            STATE.nodes.forEach(node => {
                ctx.beginPath();
                ctx.arc(node.x, node.y, NODE_RADIUS, 0, Math.PI * 2);
                
                if (node.color) {
                    ctx.fillStyle = node.color;
                    ctx.strokeStyle = '#e2e8f0'; // Светлая обводка для цветных узлов
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = node.color; // Неоновое свечение
                } else {
                    ctx.fillStyle = '#374151'; // Темно-серый для нераскрашенных (bg-gray-700)
                    ctx.strokeStyle = '#9ca3af'; // Обводка нераскрашенных (text-gray-400)
                    ctx.shadowBlur = 0;
                }
                
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.stroke();
                
                // Сброс теней, чтобы они не наслаивались на другие элементы
                ctx.shadowBlur = 0;
            });
        }

        function updateTimer() {
            if (!STATE.isPlaying) return;
            const elapsed = Math.floor((Date.now() - STATE.timeStart) / 1000);
            const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
            const secs = String(elapsed % 60).padStart(2, '0');
            uiElements.time.innerText = `${mins}:${secs}`;
        }

        function gameLoop() {
            if (STATE.isPlaying) updatePhysics();
            draw();
            updateTimer();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // Инициализация игры
        startLevel();
        gameLoop();
    </script>
</body>
</html>
